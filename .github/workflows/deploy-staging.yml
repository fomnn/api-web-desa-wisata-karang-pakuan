name: Deploy staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm test:e2e

      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the staging GitHub Environment."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Resolve staging D1 database ID
        run: |
          database_id="$(jq -er '.env.staging.d1_databases[0].database_id' wrangler.jsonc)"
          echo "CLOUDFLARE_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Apply D1 migrations
        run: pnpm db:migrate
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: pnpm exec wrangler deploy -c .output/server/wrangler.json --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        if: ${{ vars.STAGING_API_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 \
            "$STAGING_API_URL/api/categories" > /dev/null
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
